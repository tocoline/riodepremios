# Worker coletor: busca os resultados automaticamente e grava no D1
name = "riodepremios-coletor"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[triggers]
# a cada minuto: completa o histórico; os últimos resultados são buscados a cada 10 min (2 min no horário dos sorteios)
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "riodepremios"
database_id = "6d6262fc-bbe1-4fa2-91a7-bda343cc1070"

# Defina o token do endpoint manual com: wrangler secret put RUN_TOKEN -c workers/coletor/wrangler.toml
